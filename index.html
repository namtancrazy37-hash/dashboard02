<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharmacy Stock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root,[data-theme=dark]{color-scheme:dark;--bg:#000;--deep:#161616;--card:#232323;--inp:#2d2d2d;--ink:#fff;--mut:#808080;--line:#414141;--red:#e50914;--wine:#461518;--ox:#6f181d;--navy:#192247;--blue:#4061e7;--alt:#d9b3b5;--green:#2fb67c;--amber:#f5a524;--purple:#9b5de5;--teal:#00b8d9;--pink:#ff6f91}
[data-theme=light]{color-scheme:light;--bg:#f3f4f8;--deep:#e9ebf2;--card:#fff;--inp:#e4e7ef;--ink:#15171c;--mut:#667085;--line:#d3d8e3;--red:#d90812;--wine:#fde4e5;--ox:#f6c2c5;--navy:#dde4fb;--blue:#3556d8;--alt:#8a2a30;--green:#12875a;--amber:#b86e00;--purple:#7a3fd0;--teal:#0086a3;--pink:#d6336c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:400 15px/1.5 "Netflix Sans","Helvetica Neue","Segoe UI",Roboto,Ubuntu,"Noto Sans Thai",system-ui,sans-serif;transition:background .2s,color .2s}
svg{flex:none;vertical-align:middle}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--red),var(--purple))}
h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:900;line-height:1.1;letter-spacing:-.02em}
h2{margin:0 0 10px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 svg{color:var(--c,var(--blue))}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
nav button{font:500 14px inherit;font-family:inherit;color:var(--mut);background:none;border:0;border-radius:10px;padding:9px 13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
nav button svg{color:var(--c,var(--mut))}
nav button:hover{background:var(--deep)}
nav button[aria-selected=true]{background:var(--inp);color:var(--ink)}
nav .tg{border:1px solid var(--line);color:var(--ink);margin-left:8px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.cta{display:inline-flex;gap:8px;align-items:center;background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:500 15px inherit;font-family:inherit;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;background:var(--deep);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.pre{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.drop{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:var(--deep);border:1px dashed var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.drop.on{border-color:var(--blue)}.sr{position:absolute;opacity:0;width:1px;height:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}.chip{background:var(--card);border-radius:8px;padding:4px 10px;color:var(--mut);display:inline-flex;gap:6px;align-items:center}.chip.ok{color:var(--ink)}.chip.ok svg{color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi,.card{background:var(--card);border-radius:12px;padding:14px 16px;min-width:0}
.kpi{display:flex;justify-content:space-between;gap:10px;border-top:3px solid var(--c,var(--line))}
.ki{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.kl{font-size:13px;color:var(--mut)}.kv{font-size:26px;font-weight:900;line-height:1.2;margin:2px 0}.ks{font-size:12px;color:var(--mut)}
.kpi.al{background:var(--wine)}.kpi.al .kl,.kpi.al .ks{color:var(--alt)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:12px}
.cw{position:relative;height:300px}
.tw{overflow:auto;max-height:480px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:500}td.n,th.n{text-align:right}
.b{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;background:var(--inp);color:var(--ink);margin-right:4px}
.b.r{background:var(--ox)}.b.w{background:var(--wine)}.b.i{background:var(--navy)}
.b.g{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.b.a{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.b.p{background:color-mix(in srgb,var(--purple) 22%,transparent);color:var(--purple)}
.mode{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mode button{flex:1;min-width:200px;text-align:left;background:var(--card);color:var(--ink);border:1px solid transparent;border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit}
.mode button[aria-pressed=true]{border-color:var(--ink);background:var(--inp)}.mode small{display:block;color:var(--mut)}
.note{font-size:12.5px;color:var(--mut);margin:8px 0 0}.empty{color:var(--mut);padding:24px 4px}
ul.l{margin:0;padding:0;list-style:none}ul.l li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.gap li{display:flex;gap:10px;align-items:flex-start}ul.gap svg{color:var(--amber);margin-top:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="brand"><div class="logo" data-i="pill" data-s="26"></div><div><h1>Pharmacy Stock</h1><div class="sub" id="sub">โหลดไฟล์ JSON เพื่อเริ่มต้น (ข้อมูลไม่ได้ฝังอยู่ในหน้านี้)</div></div></div>
 <nav id="nav" aria-label="เมนู">
  <button data-t="ov" style="--c:var(--blue)" aria-selected="true"><i data-i="grid"></i>ภาพรวม</button>
  <button data-t="ex" style="--c:var(--amber)" aria-selected="false"><i data-i="cal"></i>วันหมดอายุ</button>
  <button data-t="or" style="--c:var(--green)" aria-selected="false"><i data-i="cart"></i>สั่งซื้อ</button>
  <button data-t="dp" style="--c:var(--pink)" aria-selected="false"><i data-i="pill"></i>รายการจ่ายยา</button>
  <button data-t="fe" style="--c:var(--purple)" aria-selected="false"><i data-i="layers"></i>ตรวจ FEFO</button>
  <button data-t="an" style="--c:var(--teal)" aria-selected="false"><i data-i="flask"></i>วิเคราะห์เพิ่มเติม</button>
  <button class="tg" id="theme" type="button" aria-label="สลับโหมดสว่าง/มืด"></button>
 </nav>
</header>

<label class="drop" id="drop">
 <input class="sr" type="file" id="file" multiple accept=".json,application/json">
 <span class="cta"><i data-i="up"></i>เลือกไฟล์ JSON</span>
 <span>ระบบโหลดจากโฟลเดอร์ data อัตโนมัติ หรือเลือก/ลากไฟล์มาวางเองได้: ทะเบียนยา, คงคลัง (stock), ประวัติจ่ายยา (dispense log) ระบบแยกประเภทไฟล์จากโครงสร้างเอง</span>
 <span class="chips" id="chips"></span>
</label>
<div id="msg" class="note"></div>

<div class="bar" id="bar" hidden>
 <label>ตั้งแต่<input type="date" id="pf"></label>
 <label>ถึง (วันอ้างอิงหมดอายุ)<input type="date" id="pt"></label>
 <button class="pre" data-d="7">7 วัน</button><button class="pre" data-d="30">30 วัน</button><button class="pre" data-d="0">ทั้งหมด</button>
 <span class="sub" id="pinfo"></span>
</div>
<main id="view"><div class="empty">ยังไม่มีข้อมูล เลือกไฟล์ JSON ด้านบนก่อน</div></main>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const D={drug:{},stock:[],disp:[],asof:'',have:{}},P={from:'',to:''},M={m:'mix',n:30,all:false},V={tab:'ov',win:90,risk:true,q:'',bad:false};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US'),f1=n=>(Math.round(n*10)/10).toLocaleString('en-US');
const dd=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5),dOf=x=>x.datetime.slice(0,10);
const add=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const nm=k=>D.drug[k]?D.drug[k].generic_name+' '+D.drug[k].strength:k;
const ref=()=>P.to||D.asof||new Date().toISOString().slice(0,10);
const inP=d=>(!P.from||dOf(d)>=P.from)&&(!P.to||dOf(d)<=P.to);
const ST={active:'ใช้งาน',quarantine:'กักกัน',written_off:'ตัดจำหน่าย'};
const PAL=['#4061e7','#e50914','#2fb67c','#f5a524','#9b5de5','#00b8d9','#ff6f91','#8bc34a'];
const WD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
const bd=(t,c)=>`<span class="b ${c||''}">${esc(t)}</span>`;

/* ---------- icons ---------- */
const IC={
grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
pill:'<path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7z"/><path d="m8.5 8.5 7 7"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
check:'<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m22 4-10 10-3-3"/>',
shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
dollar:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
flask:'<path d="M9 3h6M10 3v6L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9V3"/>',
hash:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
pie:'<path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>'};
const I=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const icons=()=>$$('[data-i]').forEach(e=>{e.innerHTML=I(e.dataset.i,+e.dataset.s||18);if(e.tagName==='I')e.style.display='inline-flex'});
const kpi=(l,v,s,al,ic,c)=>`<div class="kpi${al?' al':''}" style="--c:${c||'var(--blue)'}"><div><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s||'&nbsp;'}</div></div><div class="ki">${I(ic||'hash',20)}</div></div>`;
const h2=(t,ic,c)=>`<h2 style="--c:${c||'var(--blue)'}">${I(ic,18)}${t}</h2>`;

/* ---------- theme ---------- */
let T='dark';try{T=localStorage.getItem('ph-theme')==='light'?'light':'dark'}catch(e){}
function applyTheme(){document.documentElement.dataset.theme=T;$('#theme').innerHTML=T==='dark'?I('sun')+'โหมดสว่าง':I('moon')+'โหมดมืด'}
$('#theme').onclick=()=>{T=T==='dark'?'light':'dark';try{localStorage.setItem('ph-theme',T)}catch(e){}applyTheme();render()};

/* ---------- charts ---------- */
const ch={},cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function chart(id,cfg){if(ch[id])ch[id].destroy();Chart.defaults.color=cv('--mut');Chart.defaults.borderColor=cv('--line');ch[id]=new Chart(document.getElementById(id),cfg)}
function bar(id,rows,color,horiz){const c=color==='pal'?rows.map((_,i)=>PAL[i%PAL.length]):color;chart(id,{type:'bar',data:{labels:rows.map(r=>r[0]),datasets:[{data:rows.map(r=>r[1]),backgroundColor:c,borderRadius:4}]},options:{indexAxis:horiz?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:!horiz}},y:{grid:{display:!!horiz},beginAtZero:true}}}})}
function stack(id,labels,sets){chart(id,{type:'bar',data:{labels,datasets:sets.map((s,i)=>({label:s[0],data:s[1],backgroundColor:PAL[i%PAL.length],borderRadius:2}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:sets.length>1,position:'bottom'}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true}}}})}
function donut(id,rows){chart(id,{type:'doughnut',data:{labels:rows.map(r=>r[0]),datasets:[{data:rows.map(r=>r[1]),backgroundColor:rows.map((r,i)=>r[2]||PAL[i%PAL.length]),borderColor:cv('--card'),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}

/* ---------- load files ---------- */
const note=t=>{$('#msg').innerHTML+=esc(t)+'<br>'};
async function ingest(files){
 $('#msg').innerHTML='';
 for(const f of files){try{
  const j=JSON.parse(await f.text()),it=Array.isArray(j)?j:j.items;
  if(!Array.isArray(it)||!it.length){note(f.name+': ไม่พบรายการใน items');continue}
  const s=it[0],mt=j.meta||{};
  if('generic_name' in s){D.drug={};it.forEach(i=>D.drug[i.sku]=i);D.have.drug=f.name+' ('+it.length+')'}
  else if('lot' in s&&'expiry' in s){D.stock=it;if(mt.as_of)D.asof=mt.as_of;D.have.stock=f.name+' ('+it.length+')'}
  else if('dispense_id' in s){D.disp=it;if(mt.as_of&&!D.asof)D.asof=mt.as_of;D.have.disp=f.name+' ('+it.length+')'}
  else note(f.name+': ไม่รู้จักโครงสร้างไฟล์นี้')
 }catch(e){note(f.name+': อ่านไฟล์ไม่ได้ ('+e.message+')')}}
 const ds=D.disp.map(dOf).sort();
 if(ds.length){P.from=ds[0];P.to=D.asof||ds[ds.length-1]}else if(D.asof){P.to=D.asof}
 $('#pf').value=P.from;$('#pt').value=P.to;render()}
$('#file').addEventListener('change',e=>{ingest([...e.target.files]);e.target.value=''});
const dz=$('#drop');
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>ingest([...e.dataTransfer.files]));

/* ---------- derived data ---------- */
const lots=()=>D.stock.map(s=>{const days=s.expiry?dd(s.expiry,ref()):null,q=+s.qty_on_hand||0;return{...s,days,val:Math.max(q,0)*(+s.unit_cost||0),usable:s.status==='active'&&q>0&&days!==null&&days>=0}});
function sk(){
 const U={},days=P.from&&P.to?Math.max(1,dd(P.to,P.from)+1):30;
 lots().forEach(l=>{const o=U[l.sku]=U[l.sku]||{sku:l.sku,use:0,usable:0,cost:0,cd:''};if(l.usable)o.usable+=l.qty_on_hand;if(l.received_date>=o.cd){o.cd=l.received_date;o.cost=+l.unit_cost||0}});
 D.disp.forEach(d=>{if(d.type!=='void'&&d.qty>0&&inP(d)&&U[d.sku])U[d.sku].use+=d.qty});
 return Object.values(U).map(o=>{
  const rl=(D.drug[o.sku]||{}).reorder_level||0,daily=o.use/days,cover=daily?o.usable/daily:Infinity;
  const tA=rl>0&&o.usable<=rl,qA=Math.max(0,2*rl-o.usable),tB=daily>0&&cover<M.n,qB=Math.max(0,daily*2*M.n-o.usable);
  const t=M.m==='rl'?tA:M.m==='use'?tB:tA||tB;
  const q=Math.ceil(M.m==='rl'?qA:M.m==='use'?qB:Math.max(tA?qA:0,tB?qB:0));
  return{...o,rl,daily,cover,tA,tB,t,q:t?q:0,est:t?q*o.cost:0}})}
function lotFlags(s){const f=[];if(!s.expiry)f.push('ไม่มีวันหมดอายุ');else if(s.expiry<s.received_date)f.push('หมดอายุก่อนวันรับเข้า');if(Object.keys(D.drug).length&&!D.drug[s.sku])f.push('SKU ไม่มีในทะเบียนยา');return f}
function dFlags(d){const f=[],s=D.stock.find(x=>x.sku===d.sku&&x.lot===d.lot);
 if(D.asof&&dOf(d)>D.asof)f.push('วันที่หลังวันที่ของข้อมูล');
 if(D.stock.length){if(!s)f.push('ล็อตไม่มีในคงคลังของ SKU นี้');else if(s.expiry&&dOf(d)>s.expiry)f.push('จ่ายหลังหมดอายุ')}
 if(!Number.isInteger(d.qty))f.push('จำนวนไม่ใช่จำนวนเต็ม');return f}
const issues=()=>[...D.disp.flatMap(d=>dFlags(d).map(t=>[d.dispense_id,t])),...D.stock.flatMap(s=>lotFlags(s).map(t=>[s.stock_id,t]))];
const need=(...k)=>{const m=k.filter(x=>!(x==='drug'?Object.keys(D.drug).length:x==='stock'?D.stock.length:D.disp.length));return m.length?`<div class="empty">ต้องโหลดไฟล์เพิ่ม: ${m.map(x=>({drug:'ทะเบียนยา',stock:'คงคลัง',disp:'ประวัติจ่ายยา'}[x])).join(', ')}</div>`:''};

/* FEFO: ล็อตที่จ่าย vs ล็อต active อื่นของ SKU เดียวกันที่หมดอายุก่อน, รับเข้าแล้ว, ยังไม่หมดอายุ ณ วันจ่าย และยังมียอดคงเหลือ */
function fefo(){
 const bySku={},out=[];D.stock.forEach(s=>{(bySku[s.sku]=bySku[s.sku]||[]).push(s)});
 D.disp.filter(d=>d.type!=='void'&&d.qty>0).forEach(d=>{
  const used=D.stock.find(s=>s.sku===d.sku&&s.lot===d.lot);if(!used||!used.expiry)return;const day=dOf(d);
  const earlier=(bySku[d.sku]||[]).filter(s=>s.lot!==d.lot&&s.status==='active'&&s.expiry&&s.expiry<used.expiry&&s.expiry>=day&&s.received_date<=day&&(+s.qty_on_hand||0)>0).sort((a,b)=>a.expiry<b.expiry?-1:1);
  out.push({d,used,earlier,bad:earlier.length>0})});
 return out}
function phStats(){

 const W=[];Object.entries(by).forEach(([k,a])=>{a.sort((x,y)=>x.days-y.days);let cum=0;const dl=sm[k]?sm[k].daily:0;
  a.forEach(l=>{const can=Math.max(0,dl*l.days-cum),w=Math.max(0,l.qty_on_hand-can);cum+=l.qty_on_hand;if(w>0)W.push({...l,w:Math.ceil(w),wv:Math.ceil(w)*(+l.unit_cost||0),dl})})});
 W.sort((a,b)=>b.wv-a.wv);

 const A=S.map(s=>({...s,v:s.use*s.cost})).filter(s=>s.v>0).sort((a,b)=>b.v-a.v),tv=A.reduce((a,s)=>a+s.v,0);let c=0;
 A.forEach(s=>{c+=s.v;s.cum=c/tv;s.k=s.cum-s.v/tv<0.8?'A':s.cum-s.v/tv<0.95?'B':'C'});

/* โหลดอัตโนมัติจากโฟลเดอร์ data (ต้องเปิดผ่านเว็บเซิร์ฟเวอร์) */
async function autoload(){
 const base='data/';let names=[];
 try{const r=await fetch(base,{cache:'no-store'});if(r.ok){const t=await r.text();names=[...t.matchAll(/href="([^"?#]+\.json)"/gi)].map(m=>decodeURIComponent(m[1]).split('/').pop())}}catch(e){}
 if(!names.length){try{const r=await fetch(base+'index.json',{cache:'no-store'});if(r.ok){const j=await r.json();names=Array.isArray(j)?j:(j.files||[])}}catch(e){}}
 names=[...new Set(names)].filter(n=>n!=='index.json'&&n!=='manifest.json');
 if(!names.length)names=['drugs_update.json','stock (1).json','dispense-log (1).json'];
 const fs=[],errors=[];
 for(const n of names){try{const r=await fetch(base+encodeURIComponent(n),{cache:'no-store'});if(r.ok){const t=await r.text();fs.push({name:n,text:async()=>t})}else errors.push(n+': HTTP '+r.status)}catch(e){errors.push(n+': '+e.message)}}
 if(fs.length){await ingest(fs);errors.forEach(e=>note('data/'+e))}else{note('โหลดอัตโนมัติจากโฟลเดอร์ data ไม่ได้ (ต้องเปิดผ่านเว็บเซิร์ฟเวอร์ และมีไฟล์ .json ในโฟลเดอร์) ใช้ปุ่มเลือกไฟล์แทนได้');errors.forEach(e=>note('data/'+e))}}
icons();applyTheme();render();autoload();
</script>
